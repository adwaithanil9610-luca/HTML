<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .element {
      width: 100px;
      height: 100px;
      background-color: #3498db;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      transform: scale(1);
      transition: transform 0.5s ease; Smooth animation
    }
     .element:hover {
      transform: scale(.5); /* Zoom on hover */
    }
</style>
</head>
<body>
    <div class="element">Hover Me!</div>
</body>
</html>
