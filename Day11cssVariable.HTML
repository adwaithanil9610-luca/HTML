<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --mycolor:rgb(236, 118, 118);
        }
        h1{
            color: var(--mycolor);
        }
        h3{
            color: var(--mycolor);
        }
        button{
            background-color: yellowgreen;
            border: none;
            padding: 15px;
            width: 250px;
            border-radius: 5px;
            color: aliceblue;
            transition: background-color 1s ease .3s;

        }
        button:hover{
            background-color: black;
        }
        div{
            width: 200px;
            height: 200px;
            background-color: aqua;
            transition: all 4s 1s ;
        }
        div:hover{
            background-color: rgb(15, 221, 153);
            width: 300px;
            height: 300px;
        }
    </style>
</head>
<body>
    <h1>Hello</h1>
    <h4>my</h4>
    <h3>brother</h3>
    <span>myyyy</span>
    <hr>
    <button>clickme</button>
    <hr>
    <div>

    </div>
</body>
</html>
