<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input:focus{
            border: 4px solid red;
            outline: none;
        }
        li:first-child{
            color: blue;
        }
        li:last-child{
            color: red;
        }
        li:nth-child(4){
            color: aqua;
        }
        li:nth-child(even){
            color: brown;
        }
    </style>
</head>
<body>
    <input type="text" name="" id="">

    <ul>
        <li>abc</li>
        <li>abc</li>
        <li>abc</li>
        <li>abc</li>
        <li>abc</li>

        

        
    </ul>
</body>
</html>
