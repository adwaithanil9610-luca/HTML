<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            padding: 30px;
        }

        h2 {
            border: 5px solid red;
            color: white;
            background-color: orange;
            padding: 20px;
            text-align: center;
            font-weight: bolder;
        }

        p {
            color: rgb(141, 34, 242);
            font-weight: lighter;
            font-style: oblique;
            border-bottom: dotted;
            padding-bottom: 10px;

        }

        .hello {
            border: 4px dashed rgb(85, 85, 226);
            background-color: rgb(116, 242, 158);
            width: 90%;

        }

        h4 {
            color: brown;
        }

        #p1 {
            color: brown;
            font-weight: bolder;
        }

        .hey {
            background-color: yellow;
            font-weight: bold;
            padding: 5px;
            color: rgb(17, 14, 14);
        }

    li:nth-child(2)::first-letter{
        background-color: yellow;
        color: red;
    }
    </style>
</head>

<body>
    <div>
        <h2> Welcome to Animal World </h2>
        <p>Explore some of my favourite animals below!</p>
        <h4>My Top 3 Favorite Animals </h4>
        <div class="hello">
            <ul>
                <li id="p1"> Elephant </li>
                <li class="hey"> Peneguin</li>
                <li> Dolphin</li>


            </ul>
        </div>
    </div>
</body>

</html>
