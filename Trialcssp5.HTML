<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            padding: 40px;
            background-color: rgb(195, 224, 214);
        }

        h1 {
            background: linear-gradient(to left, rgb(50, 227, 77), rgb(200, 202, 216));
            text-align: center;
            border-radius: 20px;
            padding: 10px;
        }

        p {
            text-align: center;
            color: blueviolet;
        }

        ul {
            list-style: none;

        }

        ul li {
            margin: 10px;
            border-radius: 8px;
            padding: 8px;
            width: 500px;
        }

        li:first-child {
            background-color: rgb(149, 248, 228);
            width: 200px;
        }

        li:last-child {
            background-color: rgb(149, 248, 228);
            width: 200px;

        }

        li:nth-child(4) {
            background-color: blanchedalmond;
            width: 200px;
        }

        li:nth-child(2) {
            background-color: antiquewhite;
            width: 200px;
        }

        li:nth-child(3) {
            background-color: rgb(149, 248, 228);
            width: 200px;
        }

        li:hover {
            cursor: pointer;
            transform: scale(1.05);
            background-color: rgb(114, 250, 252);
        }

        ul {
             margin: auto;
            display: block;
        }
    </style>
</head>

<body>
    <div>
        <h1> 🌼 Welcome to my Garden 🌼</h1>

        <p>🍃These are some of my favorite magical plants🍃 </p>
        <ul>
            <li>🍂Lavender</li>
            <li>🍂Sunflower</li>
            <li>🍂Rosemary</li>
            <li>🍂Mint</li>
            <li>🍂Chamomile</li>
        </ul>
    </div>
</body>

</html>
